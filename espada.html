<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Símbolo encontrado</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">

<style>

body{
margin:0;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;

background-image:url("img/textura.jpg");
background-size:cover;
background-attachment:fixed;

font-family:'Cinzel', serif;
}

.container{
max-width:400px;
}

.symbol{
width:180px;
margin-bottom:20px;
}

h1{
font-size:1.8rem;
margin-bottom:15px;
}

p{
font-size:1rem;
}

</style>

</head>

<body>

<div class="container">

<img src="img/espada.webp" class="symbol" alt="Espada">

<h1
data-es="Has encontrado la Espada del Gladiador"
data-it="Hai trovato la Spada del Gladiatore">

Has encontrado la Espada del Gladiador

</h1>

<p
data-es="Los gladiadores luchaban con valentía en la arena por la gloria y el honor."
data-it="I gladiatori combattevano con coraggio nell'arena per la gloria e l'onore.">

Los gladiadores luchaban con valentía en la arena por la gloria y el honor. 

</p>

<p
data-es="Continúa buscando los símbolos restantes."
data-it="Continua a cercare i simboli rimanenti.">

Continúa buscando los símbolos restantes.

</p>

</div>

<script>

/* guardar progreso */
localStorage.setItem("espada", true)

/* detectar idioma */
const lang = localStorage.getItem("lang") || "es"

document.querySelectorAll("[data-es]").forEach(el=>{
el.textContent = el.getAttribute("data-" + lang)
})

/* volver al inicio */
setTimeout(function(){
window.location.href = "index.html"
},4000)

</script>

</body>

</html>
